name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Unit tests (urgency policy)
        run: bun run test
      - name: End-to-end tests (MCP + HTTP + SSE)
        run: |
          python -m pip install pytest
          python -m pytest -q channel/test/test_channel.py
      - name: Demo runs without any account
        run: bun run demo
